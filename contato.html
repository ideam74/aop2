<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestre da Guitarra | Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🎸 Mestre da Guitarra</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="fundamentos.html">Fundamentos</a></li>
                <li><a href="tecnicas.html">Técnicas</a></li>
                <li><a href="equipamentos.html">Equipamentos</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Entre em Contato</h2>
        <p style="text-align: center; margin-bottom: 30px;">Tem alguma dúvida sobre as aulas ou quer sugerir um novo
            tema? Deixe sua mensagem abaixo!</p>

        <form class="form-contato" action="#" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="form-group">
                <label for="mensagem">Sua Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="6" required
                    placeholder="Como podemos te ajudar?"></textarea>
            </div>

            <button type="submit">Enviar Mensagem</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Mestre da Guitarra. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
